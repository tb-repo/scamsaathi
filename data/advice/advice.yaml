# Curated next-step templates (FR-050, FR-052). The advisory agent selects from these
# deterministically; the LLM may only reword them for language and context (docs/05 A8).
# Actions must never ask the user for secrets (FR-064). Any phone number or URL in an action
# must exist in data/contacts/contacts.yaml (enforced by tests and, at runtime, the guardrail).
version: 2

# Shown instead of normal advice when the text suggests a child and sexual content
# (POCSO Act 2012 s.19 mandatory reporting; docs/16 section 10). Facts only, no section numbers.
child_safety:
  - This may involve a child. Report it to the police straight away; you can also file a complaint on the National Cyber Crime Reporting Portal. Indian law requires anyone who knows of such a case to report it.
  - Do not forward, share, or save the images or videos, even as proof. Note the account name, number, and links instead.
  - Do not pay or negotiate with the person making threats.
  - Stay with the child, reassure them that it is not their fault, and keep the device as it is for the police.

# What to keep for a complaint (electronic records are admissible evidence: BSA 2023 s.61-63).
evidence:
  - Do not delete the chats, call logs, or messages. Take screenshots that show the number or link, the date, and the time.
  - Keep the phone or device you received the message on, as the original electronic record may be needed as evidence.

# How to approach the police (BNSS 2023 s.173(1), (2)).
police_reporting:
  - You can report at any police station, even if the fraud happened elsewhere. Information can also be given electronically and signed within three days.
  - Ask for a free copy of the recorded complaint or FIR and keep the complaint number.

# Shown first when the user says money was sent or secrets were shared.
urgent_recovery:
  - Call 1930 (National Cyber Crime Helpline) now. Reporting quickly gives the best chance to freeze the money.
  - Call your bank on the number printed on your card or in its official app and ask them to block the card, UPI, or account.
  - Ask your bank for a statement of the transactions and note each transaction ID (UTR).
  - Change your net banking and UPI PINs and passwords from a safe device.
  - Note the transaction ID (UTR), amount, date and time, and keep screenshots of the chat and caller number.
  - Complete the complaint on the National Cyber Crime Reporting Portal at https://cybercrime.gov.in

by_level:
  CRITICAL:
    - Stop all contact immediately. Do not make payments, click links, share passwords or OTPs, or install apps.
    - Block the sender number or contact immediately.
  HIGH:
    - Do not pay, click links, or share OTP, PIN, CVV, or passwords.
    - Block the number or sender.
  MEDIUM:
    - Do not act on this message yet. Verify it through the organisation's official app, website, or the number printed on your card.
    - Do not share any code or personal details until you have verified.
  LOW:
    - No strong scam signs were found. Still verify through official channels before paying or sharing details.

# Typology-specific advice, added after the level advice.
by_typology:
  SC-01:
    - Official authorities (Police, CBI, ED, Courts, or Government bodies) never demand payments, threaten immediate arrest, or conduct interrogations over video calls, SMS, or WhatsApp.
    - Real legal notices, summons, or warrants are served through registered post or official government portals, never informal messaging links.
    - Discuss the situation with a family member or visit your local police station in person before taking any action.
  SC-02:
    - Banks never ask for OTP, PIN, CVV, or passwords. Update KYC only in the official app or at a branch.
    - Indian bank websites use the .bank.in domain. Check the address before entering anything.
  SC-03:
    - Never read out or forward an OTP, even to someone claiming to be from your bank.
  SC-04:
    - Your UPI PIN is only needed to pay, never to receive money.
    - Check your bank app for the actual credit; do not trust screenshots.
  SC-05:
    - Real jobs do not ask you to pay to work or to withdraw your earnings. Leave the group.
  SC-06:
    - Do not install unknown loan apps. Keep screenshots of any threats and report them.
  SC-07:
    - Track parcels only on the courier's official website or app with your own tracking number.
  SC-08:
    - Real prizes never require a fee or tax to be paid first.
  SC-09:
    - Nobody can guarantee investment returns. Do not pay to withdraw "profits".
  SC-10:
    - Check your bill only in the provider's official app or website. Do not call numbers from the SMS.
  SC-11:
    - Do not install screen-sharing apps such as AnyDesk or TeamViewer, or APK files, on request.
    - If you installed one, uninstall it and disconnect from the internet, then call your bank.
  SC-12:
    - Call the person on their old, known number before sending any money.
  SC-13:
    - Do not deposit money into betting or real-money game apps. Offering, advertising, or taking payments for online money games is prohibited in India.
  SC-14:
    - Do not pay the blackmailer and stop replying. Paying rarely ends the demands.
    - Report the content and the account to the platform; platforms must act quickly on complaints about intimate or morphed images.
  SC-15:
    - Never let anyone use your bank account, UPI ID, card, or SIM. An account used to move stolen money can be frozen and traced to you.
    - Check the mobile connections registered in your name on Sanchar Saathi and get any you did not take disconnected.

# Reporting guidance by situation. Contact IDs refer to data/contacts/contacts.yaml.
contacts_by_situation:
  money_lost: [helpline_1930, ncrp_portal]
  suspected: [chakshu, ncrp_suspect]
  child_safety: [police_112, ncrp_portal]
  spam: [ucc_1909, chakshu_spam]

# Extra verified channels for specific typologies (Sanchar Saathi, verified 2026-11-12).
contacts_by_typology:
  SC-01: [report_intl_call]
  SC-15: [sanchar_connections]

# Shown second, straight after "stop contact", whenever fraud is suspected. Reporting lets the
# authorities act on the number, link, or ID, which protects other people too.
# Chakshu acts on reports made within 30 days (sancharsaathi.gov.in/sfc, verified 2026-11-12).
# The Cyber Crime Portal takes suspect numbers, UPI IDs, and websites (verified 2026-11-11).
# ScamSaathi never collects reports itself (FR-087); it only points to these channels.
report_suspected:
  - Report it, even if you did not lose money. This helps the authorities act on the number or link and protect others. Report the call, SMS, or WhatsApp message on Chakshu at https://sancharsaathi.gov.in/sfc within 30 days.
  - You can also report the scammer's number, UPI ID, or website on the Cyber Crime Portal at https://cybercrime.gov.in

# Added when a TRAI 140-series number or a promotional (-P) sender header appears.
# Source: TCCCPR 2018 as amended 12 Feb 2025 (reg. 23, 25, Schedule-I) and 18 Sep 2026
# (reg. 25(2), (3); Explanatory Memorandum on reg. 34A: 140xx calls are not spam unless the
# recipient has opted out). Docs/16 sections 12 and 13.
spam:
  - Promotional calls from the 140 series and promotional SMS are allowed unless you opt out. To stop them, register your preference on the DND registry by calling or sending an SMS to 1909, or through your telecom operator's app.
  - If promotional calls or SMS continue after you opt out, or a commercial call or SMS comes from an ordinary number, complain by calling or sending an SMS to 1909, or through the TRAI DND app, within 7 days. Give the sender's number or SMS header, the date, and a short description. You can also report it on Chakshu within 30 days.
